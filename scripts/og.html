<html lang="en">

<style>
  body { margin: 0; width: 1200px; height: 630px; background: #f3f2ee; color: #0d1530; font-family: 'Instrument Sans', sans-serif; }

  .mark { width: 60px; height: 60px; border-radius: 15px; background: #0d1530; color: #ffb23f; display: grid; place-items: center; font-size: 36px; }
  h1 { margin: 0; font: 800 100px/0.98 'Bricolage Grotesque'; letter-spacing: -0.035em; }
  mark { background: linear-gradient(transparent 52%, #ffb23f 52%, #ffb23f 94%, transparent 94%); color: inherit; padding: 0 0.08em; }
  p { margin: 0; font: 500 22px/1 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: #5a6178; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span class="mark">L</span><span>LuLu Studio</span></div>

    <p>Max Lutskov · lulustudio.dev</p>
  </div>
